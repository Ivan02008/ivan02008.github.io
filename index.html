<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тесты для логопеда</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f4ff; min-height: 100vh; padding: 16px; }
#app { max-width: 820px; margin: 0 auto; }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pop { 0% { transform: scale(0.96); opacity: 0; } 70% { transform: scale(1.01); } 100% { transform: scale(1); opacity: 1; } }
.fade-in { animation: fadeSlideUp 0.4s ease forwards; }
.pop-in { animation: pop 0.3s ease forwards; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px 0; border-bottom: 1px solid rgba(57, 73, 171, 0.06); margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
.topbar .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #1a237e; }
.topbar .logo .icon { font-size: 26px; }
.topbar .logo .badge { background: #e8eaf6; color: #3949ab; font-size: 9px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
.topbar .right { display: flex; align-items: center; gap: 8px; }
.topbar .right .user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1a237e; }
.topbar .right .user .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; }
.btn-icon { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px 8px; border-radius: 8px; transition: all 0.2s; }
.btn-icon:hover { background: rgba(57, 73, 171, 0.06); }
.card { background: white; border-radius: 20px; padding: 24px 28px; box-shadow: 0 4px 20px rgba(26, 35, 126, 0.04); border: 1px solid rgba(57, 73, 171, 0.04); }
.profile-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: linear-gradient(135deg, #f5f7ff, #eef1fa); border-radius: 14px; margin-bottom: 20px; }
.profile-card .avatar-big { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: white; flex-shrink: 0; }
.profile-card .info { flex: 1; }
.profile-card .info .name { font-size: 16px; font-weight: 700; color: #1a237e; }
.profile-card .info .stats { display: flex; gap: 14px; font-size: 12px; color: #666; margin-top: 3px; flex-wrap: wrap; }
.profile-card .info .stats .num { font-weight: 700; color: #1a237e; }
.question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
.question-header .num { font-size: 13px; font-weight: 600; color: #888; }
.question-header .type-tag { font-size: 10px; font-weight: 700; color: #3949ab; background: #e8eaf6; padding: 2px 12px; border-radius: 20px; text-transform: uppercase; }
.question-text { font-size: 18px; font-weight: 600; color: #1a237e; line-height: 1.6; margin-bottom: 20px; padding: 12px 16px; background: #f8faff; border-radius: 12px; border-left: 4px solid #3949ab; }
.options-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.option { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #f8faff; border: 2px solid transparent; border-radius: 12px; cursor: pointer; transition: all 0.25s; font-size: 15px; color: #333; }
.option:hover:not(.disabled) { background: #eef1fa; transform: translateX(4px); }
.option .letter { width: 30px; height: 30px; border-radius: 50%; background: #e8eaf6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #3949ab; flex-shrink: 0; }
.option .text { flex: 1; }
.option .shortcut { font-size: 11px; color: #bbb; background: rgba(0,0,0,0.03); padding: 1px 8px; border-radius: 6px; }
.option.selected { border-color: #3949ab; background: #eef1fa; }
.option.selected .letter { background: #3949ab; color: white; }
.option.correct { border-color: #2e7d32; background: #e8f5e9; }
.option.correct .letter { background: #2e7d32; color: white; }
.option.wrong { border-color: #c62828; background: #ffebee; }
.option.wrong .letter { background: #c62828; color: white; }
.option.disabled { cursor: default; opacity: 0.75; }
.progress-section { margin-bottom: 20px; }
.progress-info { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 6px; }
.progress-info .done { color: #2e7d32; font-weight: 600; }
.progress-info .remaining { color: #c62828; font-weight: 600; }
.progress-bar { background: #e8eaf6; border-radius: 10px; height: 6px; overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: 10px; transition: width 0.5s; background: linear-gradient(90deg, #3949ab, #5c6bc0, #7986cb); }
.question-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 12px; background: #f8faff; border-radius: 14px; margin-bottom: 16px; }
.question-nav .q-btn { width: 34px; height: 34px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; position: relative; font-family: 'Inter', sans-serif; }
.question-nav .q-btn.current { background: #3949ab; color: white; transform: scale(1.05); }
.question-nav .q-btn.answered-correct { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
.question-nav .q-btn.answered-wrong { background: #ffebee; color: #c62828; border: 2px solid #c62828; }
.question-nav .q-btn.unanswered { background: #e8eaf6; color: #666; }
.question-nav .q-btn .status-icon { position: absolute; top: -4px; right: -4px; font-size: 9px; }
.btn { padding: 14px 24px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-family: 'Inter', sans-serif; position: relative; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn .shortcut-hint { font-size: 11px; opacity: 0.6; font-weight: 400; position: absolute; right: 16px; }
.btn-primary { background: linear-gradient(135deg, #3949ab, #5c6bc0); color: white; box-shadow: 0 4px 16px rgba(57, 73, 171, 0.2); }
.btn-success { background: linear-gradient(135deg, #2e7d32, #43a047); color: white; box-shadow: 0 4px 16px rgba(46, 125, 50, 0.2); }
.btn-outline { background: transparent; color: #3949ab; border: 2px solid #3949ab; }
.btn-outline:hover:not(:disabled) { background: #3949ab; color: white; }
.btn-gold { background: linear-gradient(135deg, #f57f17, #ff8f00); color: white; }
.btn-review { background: linear-gradient(135deg, #6a1b9a, #8e24aa); color: white; }
.btn-danger { background: linear-gradient(135deg, #c62828, #e53935); color: white; }
.btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.fill-input { width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; background: #f8faff; font-family: 'Inter', sans-serif; }
.fill-input:focus { outline: none; border-color: #3949ab; }
.fill-input.correct { border-color: #2e7d32; background: #e8f5e9; }
.fill-input.wrong { border-color: #c62828; background: #ffebee; }
.explanation { background: #f5f7ff; padding: 12px 16px; border-radius: 10px; margin: 10px 0; font-size: 14px; color: #555; border-left: 4px solid #3949ab; }
.result-card { text-align: center; padding: 10px 0; }
.result-card .score-circle { width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #e8eaf6, #c5cae9); box-shadow: 0 8px 32px rgba(26, 35, 126, 0.1); position: relative; }
.result-card .score-circle .big { font-size: 42px; font-weight: 900; color: #1a237e; line-height: 1; }
.result-card .score-circle .total { font-size: 13px; color: #666; }
.result-card .score-circle .percent-badge { position: absolute; bottom: -10px; background: #1a237e; color: white; padding: 3px 14px; border-radius: 16px; font-size: 13px; font-weight: 700; }
.result-card .stars { font-size: 40px; margin: 8px 0; }
.result-card .message { font-size: 17px; font-weight: 600; color: #333; margin: 6px 0 14px; }
.result-card .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 0; }
.result-card .stats-grid .item { background: #f8faff; padding: 12px; border-radius: 12px; }
.result-card .stats-grid .item .num { font-size: 24px; font-weight: 800; }
.result-card .stats-grid .item .label { font-size: 11px; color: #888; margin-top: 2px; }
.result-card .stats-grid .item .num.green { color: #2e7d32; }
.result-card .stats-grid .item .num.red { color: #c62828; }
.result-card .stats-grid .item .num.gold { color: #f57f17; }
.review-item { border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; border-left: 4px solid #ddd; background: #f8faff; }
.review-item.correct-item { border-left-color: #2e7d32; background: #f1f8e9; }
.review-item.wrong-item { border-left-color: #c62828; background: #fff5f5; }
.review-item .r-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.review-item .r-header .qnum { font-weight: 700; color: #333; font-size: 13px; }
.review-item .r-header .qstatus { font-size: 12px; font-weight: 700; }
.review-item .r-header .qstatus.correct { color: #2e7d32; }
.review-item .r-header .qstatus.wrong { color: #c62828; }
.review-item .r-question { font-weight: 600; color: #1a237e; font-size: 14px; margin-bottom: 6px; }
.review-item .r-options { display: flex; flex-direction: column; gap: 3px; }
.review-item .r-options .ro { padding: 4px 10px; border-radius: 6px; font-size: 13px; background: white; }
.review-item .r-options .ro.correct-answer { background: #e8f5e9; border: 1px solid #2e7d32; }
.review-item .r-options .ro.user-wrong { background: #ffebee; border: 1px solid #c62828; }
.review-item .r-options .ro.user-correct { background: #e8f5e9; border: 1px solid #2e7d32; }
.review-item .r-options .ro.neutral { background: #f5f7fa; border: 1px solid #eee; }
.review-item .r-fill { font-size: 13px; padding: 8px 12px; border-radius: 6px; background: white; }
.review-item .r-fill .correct-ans { color: #2e7d32; font-weight: 600; }
.review-item .r-fill .wrong-ans { color: #c62828; font-weight: 600; }
.review-nav { display: flex; gap: 8px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
.review-nav button { padding: 8px 18px; border: none; border-radius: 10px; background: #e8eaf6; color: #3949ab; font-weight: 600; cursor: pointer; font-size: 13px; }
.review-nav button:disabled { opacity: 0.4; cursor: default; }
.leaderboard { margin-top: 20px; }
.leaderboard .title { font-weight: 700; color: #1a237e; font-size: 18px; margin-bottom: 12px; }
.leaderboard .entry { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #f8faff; border-radius: 12px; margin-bottom: 6px; border: 1px solid transparent; }
.leaderboard .entry .rank { font-weight: 700; color: #3949ab; font-size: 15px; min-width: 32px; }
.leaderboard .entry .rank.gold { color: #f57f17; }
.leaderboard .entry .rank.silver { color: #90a4ae; }
.leaderboard .entry .rank.bronze { color: #bf8f2a; }
.leaderboard .entry .avatar-small { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; flex-shrink: 0; }
.leaderboard .entry .info { flex: 1; }
.leaderboard .entry .info .name { font-weight: 600; color: #333; font-size: 14px; }
.leaderboard .entry .info .details { font-size: 11px; color: #888; display: flex; gap: 10px; flex-wrap: wrap; }
.leaderboard .entry .result-badge { font-weight: 700; color: #1a237e; font-size: 15px; background: #e8eaf6; padding: 2px 12px; border-radius: 16px; }
.leaderboard .entry .result-badge .small { font-size: 9px; font-weight: 400; color: #888; display: block; }
.leaderboard .entry.me { background: #e8eaf6; border-color: #3949ab; }
.marathon-status { background: linear-gradient(135deg, #1a237e, #3949ab); color: white; border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.marathon-status .score-display { font-size: 26px; font-weight: 800; }
.marathon-status .streak-display { background: rgba(255,255,255,0.15); padding: 2px 14px; border-radius: 16px; font-size: 14px; text-align: center; }
.marathon-status .take-btn { background: linear-gradient(135deg, #ff6f00, #ff8f00); border: none; color: white; padding: 6px 18px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
.marathon-status .progress-text { font-size: 12px; opacity: 0.8; }
.mode-select { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.mode-card { background: #f5f7fa; padding: 16px; border-radius: 14px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
.mode-card.active { border-color: #3949ab; background: #eef1fa; }
.mode-card .icon { font-size: 28px; }
.mode-card .label { font-weight: 700; color: #333; font-size: 14px; margin-top: 4px; }
.mode-card .desc { font-size: 11px; color: #888; }
.block-select { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.block-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #f8faff; border: 2px solid transparent; border-radius: 14px; cursor: pointer; transition: all 0.25s; }
.block-card:hover { background: #eef1fa; transform: translateX(4px); }
.block-card.active { border-color: #3949ab; background: #eef1fa; }
.block-card .block-icon { font-size: 26px; width: 40px; text-align: center; flex-shrink: 0; }
.block-card .block-info { flex: 1; }
.block-card .block-info .block-name { font-weight: 700; color: #1a237e; font-size: 15px; }
.block-card .block-info .block-count { font-size: 12px; color: #888; margin-top: 2px; }
.block-card .block-arrow { color: #3949ab; font-size: 18px; font-weight: 700; }
.tag { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.tag-correct { background: #e8f5e9; color: #2e7d32; }
.tag-wrong { background: #ffebee; color: #c62828; }
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }
.confetti { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: confettiFall linear forwards; }
@keyframes confettiFall { 0% { opacity: 1; transform: translateY(-20px) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }
.hidden { display: none !important; }
@media (max-width: 600px) {
body { padding: 10px; }
.card { padding: 18px 16px; }
.question-text { font-size: 16px; padding: 10px 14px; }
.option { font-size: 14px; padding: 12px 14px; }
.topbar .logo { font-size: 17px; }
.mode-select { grid-template-columns: 1fr; }
}
</style>
</head>

<script>

const ALL_QUESTIONS = [
{ id: 1, type: 'single', question: 'Социокультурные ценности – это:', options: ['Нормы, правила, социальные установки обусловленные социальным, культурным развитием сообщества', 'Финансовые активы, драгоценные металлы находящиеся в распоряжении сообщества', 'Произведения искусства, архитектурные памятники, находящиеся на хранении в национальных музеях'], correct: 0, section: 'Основы социологии' },
{ id: 2, type: 'single', question: 'Социальный конфликт это:', options: ['способ выражения и разрешения социальных противоречий между индивидуумами, группами и сообществами', 'конфликт работника и работодателя по вопросам оплаты труда', 'конфликт, возникший в результате исполнения гражданином требований органов власти'], correct: 0, section: 'Основы социологии' },
{ id: 3, type: 'multi', question: 'Какие из суждений о социальных нормах являются верными?', options: ['Социальные нормы – установленные в обществе правила поведения, регулирующие отношения между людьми, общественную жизнь.', 'Социальные нормы являются одним из элементов социального контроля.', 'От других видов социальных норм обычаи отличаются тем, что в них всегда выражаются представления людей о хорошем и плохом, о добре и зле.', 'Любая организация может устанавливать нормы права.', 'Социальные нормы призваны способствовать интеграции индивида в социум.'], correct: [0, 1, 4], section: 'Основы социологии' },
{ id: 4, type: 'multi', question: 'Социализация – это процесс усвоения культурных норм и освоение социальных ролей индивидом. Какие из вариантов Вы отнесете к функции социального контроля:', options: ['увольнение работника по инициативе администрации', 'оценку поступка ребенка взрослым человеком', 'государственная итоговая аттестация', 'критическую статью в газете'], correct: [0, 2, 3], section: 'Основы социологии' },
{ id: 5, type: 'single', question: 'Место, которое конкретный индивид занимает в структуре социальной системы, называется:', options: ['социальным статусом', 'социальной ролью', 'социальным положением', 'диспозицией личности'], correct: 0, section: 'Основы социологии' },
{ id: 6, type: 'single', question: 'Изменение положения индивида или группы в системе социальной стратификации называется:', options: ['профессиональным ростом', 'социальной мобильностью', 'возрастными изменениями'], correct: 1, section: 'Основы социологии' },
{ id: 7, type: 'single', question: 'Стремление к обособлению, отделению части государства или отдельного этноса определяется понятием', options: ['сегрегация', 'апартеид', 'сепаратизм'], correct: 2, section: 'Основы социологии' },
{ id: 8, type: 'single', question: 'Процесс соотнесения, отождествления индивида с культурой и традициями своего народа имеет название', options: ['национально-культурная идентификация', 'этническая идентификация', 'ресоциализация'], correct: 0, section: 'Основы социологии' },
{ id: 9, type: 'single', question: 'Девиантное поведение в социологии определяется как:', options: ['отклонение от групповой нормы', 'подчинение общим правилам', 'изменение социального статуса'], correct: 0, section: 'Основы социологии' },
{ id: 10, type: 'single', question: 'Процесс отказа от прежних ценностей, привычек, норм и правил поведения называется:', options: ['ресоциализация', 'десоциализация', 'адаптация', 'депривация'], correct: 1, section: 'Основы социологии' },
{ id: 11, type: 'single', question: 'Формирование стабильных образцов социального взаимодействия на основе формализованных правил, законов, обычаев - это', options: ['Интеракция', 'Институционализация', 'Инвестиция', 'Инновация'], correct: 1, section: 'Основы социологии' },
{ id: 12, type: 'single', question: 'Роль логопеда в процессе социализации ребёнка с речевыми нарушениями заключается в том, что он:', options: ['заменяет роль семьи в воспитании', 'способствует преодолению коммуникативных барьеров и интеграции ребёнка в социальную среду', 'определяет социальный статус ребёнка'], correct: 1, section: 'Основы социологии' },
{ id: 13, type: 'multi', question: 'Выберите российские сервисы на основе ИИ:', options: ['ChatGPT', 'GigaChat', 'Алиса А1', 'Шедеврум', 'ЯндексGPT', 'Claude'], correct: [1, 2, 3, 4], section: 'Основы ИКТ' },
{ id: 14, type: 'single', question: 'Режим предварительного просмотра служит для:', options: ['увеличения текста', 'просмотра документа перед печатью', 'вывода текста на печать'], correct: 1, section: 'Основы ИКТ' },

function getAvatarColor(name) {
let hash = 0;
for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function getAvatarLetter(name) { 
return name.charAt(0).toUpperCase(); 
}

function getProfiles() { 
try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || {}; } catch { return {}; } 
}

function saveProfiles(p) { 
localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); 
}

function getOrCreateProfile(name) {
const profiles = getProfiles();
if (!profiles[name]) {
profiles[name] = { 
name, gamesPlayed: 0, totalCorrect: 0, totalQuestions: 0, 
bestScore: 0, bestPercent: 0, createdAt: new Date().toISOString() 
};
saveProfiles(profiles);
}
return profiles[name];
}

function updateProfile(name, gameResult) {
const profiles = getProfiles();
if (!profiles[name]) {
profiles[name] = { 
name, gamesPlayed: 0, totalCorrect: 0, totalQuestions: 0, 
bestScore: 0, bestPercent: 0, createdAt: new Date().toISOString() 
};
}
const p = profiles[name];
p.gamesPlayed += 1;
p.totalCorrect += gameResult.correct;
p.totalQuestions += gameResult.total;
const percent = gameResult.total > 0 ? Math.round((gameResult.correct / gameResult.total) * 100) : 0;
if (gameResult.correct > p.bestScore) p.bestScore = gameResult.correct;
if (percent > p.bestPercent) p.bestPercent = percent;
saveProfiles(profiles);
return p;
}

function getLeaderboard() { 
try { return JSON.parse(localStorage.getItem(LEADERBOARD_KEY)) || []; } catch { return []; } 
}

function saveLeaderboard(b) { 
localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(b)); 
}

function updateLeaderboard(name) {
const profiles = getProfiles();
const board = getLeaderboard();
const filtered = board.filter(item => item.name !== name);
if (profiles[name]) {
const p = profiles[name];
const avgPercent = p.totalQuestions > 0 ? Math.round((p.totalCorrect / p.totalQuestions) * 100) : 0;
filtered.push({ 
name, gamesPlayed: p.gamesPlayed, totalCorrect: p.totalCorrect, 
totalQuestions: p.totalQuestions, avgPercent, bestScore: p.bestScore, bestPercent: p.bestPercent 
});
}
filtered.sort((a, b) => b.bestScore - a.bestScore || b.avgPercent - a.avgPercent);
saveLeaderboard(filtered);
return filtered;
}

function shuffle(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

function getRandomQuestions(count = 20) { 
return shuffle([...ALL_QUESTIONS]).slice(0, count); 
}

function handleKeyDown(e) {
if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
const btn = document.getElementById('checkBtn');
if (btn && !btn.disabled) btn.click();
}
return;
}
if (!state.answered && !state.reviewMode && state.questions.length > 0) {
const options = document.querySelectorAll('.option:not(.disabled)');
if (options.length > 0) {
if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
e.preventDefault();
state.highlightedOption = (state.highlightedOption + 1) % options.length;
highlightOption(options, state.highlightedOption);
} else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
e.preventDefault();
state.highlightedOption = (state.highlightedOption - 1 + options.length) % options.length;
highlightOption(options, state.highlightedOption);
}
}
}
if (!state.answered && !state.reviewMode && state.questions.length > 0) {
const num = parseInt(e.key);
if (num >= 1 && num <= 9) {
const options = document.querySelectorAll('.option:not(.disabled)');
if (options.length >= num) { 
options[num - 1].click(); 
state.highlightedOption = num - 1; 
}
}
}
if (e.key === 'Enter' && state.questions.length > 0) {
const nextBtn = document.getElementById('nextBtn');
if (nextBtn && !nextBtn.classList.contains('hidden')) { 
nextBtn.click(); 
return; 
}
const checkBtn = document.getElementById('checkBtn');
if (checkBtn && !checkBtn.disabled) checkBtn.click();
}
if (e.key === 'Escape') renderHome();
if (state.reviewMode) {
if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { 
e.preventDefault(); 
reviewNext(); 
} else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { 
e.preventDefault(); 
reviewPrev(); 
}
}
}

function highlightOption(options, index) {
options.forEach((el, i) => { 
el.classList.toggle('highlighted', i === index); 
});
if (options[index]) options[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

<div class="name">${state.username}</div>
<div class="stats">
<span>🎮 <span class="num">${p.gamesPlayed}</span> игр</span>
<span>✅ <span class="num">${p.totalCorrect}</span>/<span class="num">${p.totalQuestions}</span></span>
<span>🏆 <span class="num">${p.bestScore}</span> макс</span>
<span>📊 <span class="num">${avg}%</span></span>
</div>
</div>
</div>
`;
}

html += `
<div class="mode-select">
<div class="mode-card ${state.mode === 'classic' ? 'active' : ''}" onclick="selectMode('classic')">
<div class="icon">📝</div>
<div class="label">Классический</div>
<div class="desc">20 случайных вопросов</div>
</div>
<div class="mode-card ${state.mode === 'marathon' ? 'active' : ''}" onclick="selectMode('marathon')">
<div class="icon">🏃</div>
<div class="label">Марафон</div>
<div class="desc">Все ${ALL_QUESTIONS.length} вопросов</div>
</div>
<div class="mode-card ${state.mode === 'blocks' ? 'active' : ''}" onclick="selectMode('blocks')">
<div class="icon">📚</div>
<div class="label">По блокам</div>
<div class="desc">Выбрать раздел</div>
</div>
</div>
`;

if (state.mode === 'blocks') {
html += `<div class="block-select">`;
BLOCKS.forEach(block => {
const count = getQuestionsByBlock(block.name).length;
if (count === 0) return;
const isActive = state.selectedBlock === block.name;
html += `
<div class="block-card ${isActive ? 'active' : ''}" onclick="selectBlock('${block.name}')">
<div class="block-icon">${block.icon}</div>
<div class="block-info">
<div class="block-name">${block.name}</div>
<div class="block-count">${count} вопросов</div>
</div>
<div class="block-arrow">›</div>
</div>
`;
});
html += `</div>`;
if (state.selectedBlock) {
html += `<button class="btn btn-primary" onclick="startBlockGame()">🚀 Начать тест по блоку</button>`;
}
} else {
html += `<button class="btn btn-primary" onclick="startGame()">🚀 Начать тест</button>`;
}

html += `
<div class="leaderboard">
<div class="title">🏆 Таблица лидеров</div>
`;

if (board.length === 0) {
html += `<div style="text-align:center;color:#888;padding:20px;">Пока нет результатов</div>`;
} else {
board.slice(0, 10).forEach((entry, index) => {
const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
const isMe = entry.name === state.username;
const entryColor = getAvatarColor(entry.name);
html += `
<div class="entry ${isMe ? 'me' : ''}">
<div class="rank ${index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : ''}">${medal}</div>
<div class="avatar-small" style="background:${entryColor}">${getAvatarLetter(entry.name)}</div>
<div class="info">
<div class="name">${entry.name}</div>
<div class="details">
<span>🎮 ${entry.gamesPlayed} игр</span>
<span>✅ ${entry.totalCorrect}/${entry.totalQuestions}</span>
<span>🏆 ${entry.bestScore}</span>
<span>📊 ${entry.avgPercent}%</span>
</div>
</div>
<div class="result-badge">
${entry.bestScore}
<span class="small">лучший</span>
</div>
</div>
`;
});
}

html += `</div>`;
app.innerHTML = html;
}

function changeName() {
const newName = prompt('Введите ваше имя:', state.username);
if (newName && newName.trim()) {
state.username = newName.trim();
state.profile = getOrCreateProfile(state.username);
updateLeaderboard(state.username);
renderHome();
}
}

function selectMode(mode) { 
state.mode = mode; 
state.selectedBlock = null; 
renderHome(); 
}

function selectBlock(blockName) { 
state.selectedBlock = blockName; 
renderHome(); 
}

function startGame() {
if (state.mode === 'marathon') state.questions = shuffle([...ALL_QUESTIONS]);
else state.questions = getRandomQuestions(20);
state.totalQuestions = state.questions.length;
resetGameState();
renderQuestion();
}

function startBlockGame() {
if (!state.selectedBlock) return;
state.questions = shuffle(getQuestionsByBlock(state.selectedBlock));
state.totalQuestions = state.questions.length;
resetGameState();
renderQuestion();
}

function resetGameState() {
state.questionStatus = new Array(state.questions.length).fill('unanswered');
state.userAnswers = {};
state.currentIndex = 0;
state.score = 0;
state.streak = 0;
state.maxStreak = 0;
state.marathonScore = 0;
state.marathonCorrect = 0;
state.marathonAnswered = 0;
state.isFinished = false;
state.answered = false;
state.history = [];
state.reviewMode = false;
state.highlightedOption = -1;
}

// ============================================================
// ОТОБРАЖЕНИЕ ВОПРОСА
// ============================================================
function renderQuestion() {
if (state.isFinished || state.currentIndex >= state.questions.length) { 
renderResult(); 
return; 
}

const q = state.questions[state.currentIndex];
state.answered = false;
state.selectedAnswers = [];
state.highlightedOption = -1;

const app = document.getElementById('app');
const isMarathon = state.mode === 'marathon';
const isBlocks = state.mode === 'blocks';
const total = state.questions.length;
const progress = ((state.currentIndex + 1) / total * 100);
const correctCount = state.questionStatus.filter(s => s === 'correct').length;
const wrongCount = state.questionStatus.filter(s => s === 'wrong').length;
const color = getAvatarColor(state.username);
const remaining = total - state.currentIndex;

let title = '📚 Тесты';
if (isMarathon) title = '🏃 Марафон';
if (isBlocks) title = '📚 ' + state.selectedBlock;

let html = `
<div class="topbar">
<div class="logo">
<span class="icon">${isMarathon ? '🏃' : isBlocks ? '📚' : '📝'}</span>
${title}
<span class="badge">${state.username}</span>
${isMarathon ? `<span class="badge" style="background:#2e7d32;color:white;">Осталось ${remaining}</span>` : ''}
</div>
<div class="right">
<div class="user">
<div class="avatar" style="background:${color}">${getAvatarLetter(state.username)}</div>
</div>
<button class="btn-icon" onclick="renderHome()" title="Главная (Esc)">🏠</button>
</div>
</div>
`;

if (isMarathon) {
html += `
<div class="marathon-status">
<div>
<div class="score-display"><span class="star">⭐</span> ${state.marathonScore}</div>
<div class="progress-text">очков</div>
</div>
<div>
<div class="streak-display">✅ ${state.marathonCorrect}/${state.marathonAnswered || 1}</div>
<div class="progress-text">правильных</div>
</div>
<div>
<div class="streak-display">🔥 ${state.streak} <span class="fire">🔥</span></div>
<div class="progress-text">рекорд: ${state.maxStreak}</div>
</div>
<button class="take-btn" onclick="takeMarathonScore()">💰 Забрать</button>
</div>
`;
} else {
html += `
<div class="progress-section">
<div class="progress-info">
<span>Вопрос <strong>${state.currentIndex + 1}</strong> из ${total}</span>
<span><span class="done">✅ ${correctCount}</span> <span class="remaining">❌ ${wrongCount}</span></span>
</div>
<div class="progress-bar">
<div class="fill" style="width: ${progress}%;"></div>
</div>
</div>
`;
}

html += `<div class="question-nav">`;
const showCount = Math.min(total, 30);
const startIdx = Math.max(0, Math.min(state.currentIndex - 8, total - showCount));
const endIdx = Math.min(total, startIdx + showCount);
for (let i = startIdx; i < endIdx; i++) {
const status = state.questionStatus[i] || 'unanswered';
let cls = 'unanswered';
let icon = '';
if (status === 'correct') { cls = 'answered-correct'; icon = '✅'; }
else if (status === 'wrong') { cls = 'answered-wrong'; icon = '❌'; }
const isCurrent = i === state.currentIndex;
html += `
<button class="q-btn ${cls} ${isCurrent ? 'current' : ''}" onclick="goToQuestion(${i})" title="Вопрос ${i+1}">
${i + 1}
${icon ? `<span class="status-icon">${icon}</span>` : ''}
</button>
`;
}
html += `</div>`;

html += `
<div class="card fade-in">
<div class="question-header">
<span class="num">${q.section ? q.section + ' — ' : ''}Вопрос ${state.currentIndex + 1}</span>
<span class="type-tag">${getTypeIcon(q.type)} ${getTypeLabel(q.type)}</span>
</div>
<div class="question-text">${q.question}</div>
<div class="options-grid">
`;

if (q.type === 'single' || q.type === 'multi') {
const isMulti = q.type === 'multi';
q.options.forEach((opt, idx) => {
const num = idx + 1;
html += `
<div class="option" data-index="${idx}" onclick="${isMulti ? `selectMulti(${idx})` : `selectSingle(${idx})`}">
<span class="letter">${letters[idx]}</span>
<span class="text">${opt}</span>
<span class="shortcut">${num}</span>
</div>
`;
});
if (isMulti) {
html += `<div style="font-size:12px;color:#888;margin-top:4px;">💡 Выберите несколько вариантов</div>`;
}
} else if (q.type === 'fill') {
html += `
<input type="text" class="fill-input" id="fillInput" placeholder="✏️ Введите ответ..." oninput="onFillInput()">
<div style="font-size:12px;color:#888;margin-top:4px;">💡 Введите пропущенное слово</div>
`;
}

html += `
</div>
<button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()" disabled>
✅ Проверить <span class="shortcut-hint">⏎</span>
</button>
<button class="btn btn-success hidden" id="nextBtn" onclick="nextQuestion()">
${isMarathon ? '➡️ Следующий' : (state.currentIndex < state.questions.length - 1 ? '➡️ Следующий вопрос' : '🎉 Посмотреть результат')}
<span class="shortcut-hint">⏎</span>
</button>
${isMarathon ? `<button class="btn btn-outline" onclick="takeMarathonScore()" style="margin-top:6px;">💰 Забрать очки и выйти</button>` : ''}
</div>
`;

app.innerHTML = html;

if (state.userAnswers[state.currentIndex] && state.questionStatus[state.currentIndex] !== 'unanswered') {
const saved = state.userAnswers[state.currentIndex];
const options = document.querySelectorAll('.option');
options.forEach((el, i) => { 
if (saved.includes(i)) el.classList.add('selected'); 
});
state.selectedAnswers = saved;
document.getElementById('checkBtn').disabled = false;
}

if (q.type === 'fill') {
const input = document.getElementById('fillInput');
if (input) {
input.addEventListener('input', () => {
document.getElementById('checkBtn').disabled = input.value.trim() === '';
});
setTimeout(() => input.focus(), 100);
}
}
window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToQuestion(index) {
if (index >= 0 && index < state.questions.length) { 
state.currentIndex = index; 
renderQuestion(); 
}
}

function selectSingle(index) {
if (state.answered) return;
document.querySelectorAll('.option').forEach((el, i) => { 
el.classList.toggle('selected', i === index); 
});
state.selectedAnswers = [index];
document.getElementById('checkBtn').disabled = false;
state.highlightedOption = index;
}

function selectMulti(index) {
if (state.answered) return;
const el = document.querySelector(`.option[data-index="${index}"]`);
if (el.classList.contains('selected')) {
el.classList.remove('selected');
state.selectedAnswers = state.selectedAnswers.filter(i => i !== index);
} else {
el.classList.add('selected');
state.selectedAnswers.push(index);
}
document.getElementById('checkBtn').disabled = state.selectedAnswers.length === 0;
state.highlightedOption = index;
}

function onFillInput() {
const input = document.getElementById('fillInput');
if (input) document.getElementById('checkBtn').disabled = input.value.trim() === '';
}

// ============================================================
// ПРОВЕРКА ОТВЕТА
// ============================================================
function checkAnswer() {
if (state.answered) return;
const q = state.questions[state.currentIndex];
let correct = false;
let userAnswer = '';

if (q.type === 'single') {
userAnswer = q.options[state.selectedAnswers[0]] || '';
correct = state.selectedAnswers[0] === q.correct;
document.querySelectorAll('.option').forEach((el, i) => {
el.classList.add('disabled');
if (i === q.correct) el.classList.add('correct');
if (i === state.selectedAnswers[0] && i !== q.correct) el.classList.add('wrong');
});
} else if (q.type === 'multi') {
const correctAnswers = q.correct;
userAnswer = state.selectedAnswers.map(i => q.options[i]).join(', ');
document.querySelectorAll('.option').forEach((el, i) => {
el.classList.add('disabled');
if (correctAnswers.includes(i)) el.classList.add('correct');
if (state.selectedAnswers.includes(i) && !correctAnswers.includes(i)) el.classList.add('wrong');
});
correct = state.selectedAnswers.slice().sort().join(',') === correctAnswers.slice().sort().join(',');
} else if (q.type === 'fill') {
const input = document.getElementById('fillInput');
userAnswer = input.value.trim();
const correctAnswer = q.correct;
correct = userAnswer.toLowerCase() === correctAnswer.toLowerCase() || 
userAnswer.toLowerCase().includes(correctAnswer.toLowerCase()) || 
correctAnswer.toLowerCase().includes(userAnswer.toLowerCase());
input.classList.add(correct ? 'correct' : 'wrong');
input.disabled = true;
const explanation = document.createElement('div');
explanation.className = 'explanation';
explanation.innerHTML = `✅ Правильный ответ: <strong>${q.correct}</strong>`;
input.parentNode.insertBefore(explanation, input.nextSibling);
}

state.history.push({ 
question: q, 
userAnswer, 
selectedIndexes: [...state.selectedAnswers], 
correct, 
userAnswerText: userAnswer 
});

state.questionStatus[state.currentIndex] = correct ? 'correct' : 'wrong';
state.userAnswers[state.currentIndex] = [...state.selectedAnswers];
state.answered = true;

if (state.mode === 'marathon') {
state.marathonAnswered++;
if (correct) {
state.marathonCorrect++;
state.marathonScore += 10 + state.streak * 2;
state.streak++;
if (state.streak > state.maxStreak) state.maxStreak = state.streak;
} else state.streak = 0;

const statusDiv = document.querySelector('.marathon-status');
if (statusDiv) {
statusDiv.querySelector('.score-display').innerHTML = `<span class="star">⭐</span> ${state.marathonScore}`;
const correctSpan = statusDiv.querySelectorAll('.streak-display')[0];
if (correctSpan) correctSpan.innerHTML = `✅ ${state.marathonCorrect}/${state.marathonAnswered}`;
const streakSpan = statusDiv.querySelectorAll('.streak-display')[1];
if (streakSpan) streakSpan.innerHTML = `🔥 ${state.streak} <span class="fire">🔥</span>`;
}
} else {
if (correct) state.score++;
}

document.getElementById('checkBtn').disabled = true;
document.getElementById('nextBtn').classList.remove('hidden');
document.getElementById('nextBtn').focus();
renderQuestionNavOnly();
}

function renderQuestionNavOnly() {
const nav = document.querySelector('.question-nav');
if (!nav) return;
const total = state.questions.length;
const showCount = Math.min(total, 30);
const startIdx = Math.max(0, Math.min(state.currentIndex - 8, total - showCount));
const endIdx = Math.min(total, startIdx + showCount);
let html = '';
for (let i = startIdx; i < endIdx; i++) {
const status = state.questionStatus[i] || 'unanswered';
let cls = 'unanswered', icon = '';
if (status === 'correct') { cls = 'answered-correct'; icon = '✅'; }
else if (status === 'wrong') { cls = 'answered-wrong'; icon = '❌'; }
html += `
<button class="q-btn ${cls} ${i === state.currentIndex ? 'current' : ''}" onclick="goToQuestion(${i})">
${i + 1}${icon ? `<span class="status-icon">${icon}</span>` : ''}
</button>
`;
}
nav.innerHTML = html;
}

function nextQuestion() {
let nextIndex = state.currentIndex + 1;
if (state.mode !== 'marathon') {
const unanswered = state.questionStatus.findIndex(s => s === 'unanswered');
if (unanswered !== -1 && unanswered > state.currentIndex) nextIndex = unanswered;
}
if (nextIndex >= state.questions.length) { 
renderResult(); 
return; 
}
state.currentIndex = nextIndex;
renderQuestion();
}

function takeMarathonScore() {
if (state.marathonScore === 0 && state.currentIndex === 0) {
if (!confirm('Вы ещё не набрали очков. Уверены?')) return;
}
const name = state.username;
const totalAnswered = state.marathonAnswered || 1;
state.profile = updateProfile(name, { correct: state.marathonCorrect, total: totalAnswered });
updateLeaderboard(name);
alert(`🏆 ${name}, вы набрали ${state.marathonScore} очков!\n✅ Правильных: ${state.marathonCorrect} из ${totalAnswered}\n🔥 Серия: ${state.maxStreak}`);
state.isFinished = true;
renderHome();
}

// ============================================================
// РЕЗУЛЬТАТ
// ============================================================
function renderResult() {
const app = document.getElementById('app');
const total = state.questions.length;
let score = state.mode === 'marathon' ? state.marathonCorrect : state.score;
const percent = Math.round((score / total) * 100);
let stars = '', message = '';
if (percent >= 90) { stars = '🌟🌟🌟'; message = 'Отлично! Вы настоящий эксперт! 🎉'; showConfetti(); }
else if (percent >= 70) { stars = '🌟🌟'; message = 'Хороший результат! Так держать! 💪'; }
else if (percent >= 50) { stars = '🌟'; message = 'Неплохо, но есть куда расти! 📚'; }
else { stars = '📚'; message = 'Нужно ещё немного позаниматься! 💪'; }

const name = state.username;
state.profile = updateProfile(name, { correct: score, total: total });
updateLeaderboard(name);

let modeLabel = '';
if (state.mode === 'marathon') modeLabel = `<span class="badge" style="background:#2e7d32;color:white;">🏃 Марафон</span>`;
else if (state.mode === 'blocks') modeLabel = `<span class="badge" style="background:#6a1b9a;color:white;">📚 ${state.selectedBlock}</span>`;

app.innerHTML = `
<div class="topbar">
<div class="logo">
<span class="icon">📊</span>
Результаты
<span class="badge">${state.username}</span>
${modeLabel}
</div>
<div class="right">
<button class="btn-icon" onclick="renderHome()" title="Главная">🏠</button>
</div>
</div>
<div class="card fade-in">
<div class="result-card">
<div class="score-circle">
<div class="big">${score}</div>
<div class="total">из ${total}</div>
<div class="percent-badge">${percent}%</div>
</div>
<div class="stars">${stars}</div>
<div class="message">${message}</div>
<div class="stats-grid">
<div class="item"><div class="num green">${score}</div><div class="label">✅ Верно</div></div>
<div class="item"><div class="num red">${total - score}</div><div class="label">❌ Неверно</div></div>
<div class="item"><div class="num gold">${percent}%</div><div class="label">🎯 Процент</div></div>
</div>
<div class="btn-group">
<button class="btn btn-primary" onclick="${state.mode === 'blocks' ? 'startBlockGame()' : 'startGame()'}">🔄 Пройти снова</button>
<button class="btn btn-review" onclick="renderReview()">📖 Просмотреть вопросы</button>
<button class="btn btn-gold" onclick="renderHome()">🏆 Таблица лидеров</button>
</div>
</div>
</div>
`;
}

// ============================================================
// ПРОСМОТР
// ============================================================
function renderReview() {
state.reviewMode = true;
state.reviewIndex = 0;
renderReviewPage();
}

function renderReviewPage() {
const app = document.getElementById('app');
const total = state.history.length;
const h = state.history[state.reviewIndex];
if (!h) { renderHome(); return; }
const isCorrect = h.correct;
const statusText = isCorrect ? '✅ Правильно' : '❌ Неправильно';
const statusClass = isCorrect ? 'correct' : 'wrong';
const q = h.question;

let html = `
<div class="topbar">
<div class="logo"><span class="icon">📖</span> Просмотр <span class="badge">${state.reviewIndex + 1}/${total}</span></div>
<div class="right"><button class="btn-icon" onclick="renderHome()" title="Главная (Esc)">🏠</button></div>
</div>
<div style="text-align:center;margin-bottom:12px;"><span class="tag ${statusClass}">${statusText}</span></div>
<div class="review-item ${isCorrect ? 'correct-item' : 'wrong-item'}">
<div class="r-header"><span class="qnum">Вопрос #${state.reviewIndex + 1}</span><span class="qstatus ${statusClass}">${statusText}</span></div>
<div class="r-question">${q.question}</div>
<div style="font-size:11px;color:#888;margin:4px 0;">${q.section || ''} · ${getTypeLabel(q.type)}</div>
`;

if (q.type === 'single' || q.type === 'multi') {
html += `<div class="r-options">`;
const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
q.options.forEach((opt, idx) => {
let cls = 'neutral';
const isUserSelected = h.selectedIndexes.includes(idx);
const isCorrectAnswer = correctAnswers.includes(idx);
if (isCorrectAnswer && isUserSelected) cls = 'user-correct';
else if (isCorrectAnswer) cls = 'correct-answer';
else if (isUserSelected) cls = 'user-wrong';
const icon = isCorrectAnswer ? '✅' : (isUserSelected ? '❌' : '');
html += `<div class="ro ${cls}">${letters[idx]}. ${opt} ${icon}${isUserSelected && !isCorrectAnswer ? ' (ваш ответ)' : ''}${isCorrectAnswer && !isUserSelected ? ' (правильный)' : ''}</div>`;
});
html += `</div>`;
} else if (q.type === 'fill') {
html += `<div class="r-fill"><div>Ваш ответ: <span class="${isCorrect ? 'correct-ans' : 'wrong-ans'}">${h.userAnswer || '(пусто)'}</span></div><div style="margin-top:4px;">Правильный ответ: <span class="correct-ans">${q.correct}</span></div></div>`;
}

html += `</div>
<div class="review-nav">
<button onclick="reviewPrev()" ${state.reviewIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
<button onclick="renderHome()">🏠</button>
<button onclick="reviewNext()" ${state.reviewIndex >= total - 1 ? 'disabled' : ''}>Вперёд ▶</button>
</div>
<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px;">
`;
const start = Math.max(0, state.reviewIndex - 8);
const end = Math.min(total, start + 16);
for (let i = start; i < end; i++) {
const isActive = i === state.reviewIndex;
const entry = state.history[i];
const cls = entry.correct ? '✅' : '❌';
html += `<button onclick="goToReview(${i})" style="padding:4px 8px;border:none;border-radius:4px;${isActive ? 'background:#3949ab;color:white;' : 'background:#e8eaf6;color:#333;'}font-size:11px;cursor:pointer;min-width:26px;">${i + 1}${cls}</button>`;
}
html += `</div>`;
app.innerHTML = html;
}

function reviewPrev() {
if (state.reviewIndex > 0) { 
state.reviewIndex--; 
renderReviewPage(); 
}
}

function reviewNext() {
if (state.reviewIndex < state.history.length - 1) { 
state.reviewIndex++; 
renderReviewPage(); 
}
}

function goToReview(index) {
if (index >= 0 && index < state.history.length) { 
state.reviewIndex = index; 
renderReviewPage(); 
}
}
